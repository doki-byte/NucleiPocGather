name: Daily Update Nuclei POCs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 0 Build Release
      run: |
        cargo update
        cargo build --release

    - name: 1 Run Full Pipeline
      run: cargo run --release -- all
      
    - name: Commit and Push changes
      run: |
        echo $(date +'%Y%m%d%H') > date.txt
        git config --local user.email "admin@adysec.com"
        git config --local user.name "AdySec"
        # state.json 记录每个仓库上次 commit，必须提交以便下次续传
        git add .
        git commit -am "$(date +'%Y%m%d')" || echo "No changes to commit"
        git push -v --progress
